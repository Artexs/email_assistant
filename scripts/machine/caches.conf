# Installed by scripts/machine/install-caches.sh to ~/.config/user-tmpfiles.d/caches.conf.
# `systemd-tmpfiles-clean.timer` (user, daily) deletes entries unused for 1 day.
# Age counts from the newest of atime, mtime and ctime.
# SSD caches (new place):
e %h/.cache/node-compile-cache - - - 1d
e %h/.cache/playwright-transform-cache - - - 1d
# Old places in /tmp (until every shell has the new env):
e /tmp/node-compile-cache - - - 1d
e /tmp/playwright-transform-cache-1000 - - - 1d
# Job folders:
e /tmp/f[0-9]* - - - 1d
