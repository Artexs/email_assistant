name: email-assistant

# Docker log rotation for every service: 5 files of 10 MB per container (deploy/README.md § Logs). deploy/check-logging.sh checks it.
# Only `server` writes json-file, the files the log store reads (ADR 0024 point 4); every other service writes `local`.
x-logging-collected: &logging-collected
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
x-logging-local: &logging-local
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:17
    logging: *logging-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: email_assistant
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      APP_PASSWORD: ${APP_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../db/roles.sql:/db/roles.sql:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "email_assistant"]
      interval: 2s
      retries: 15

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        EA_RELEASE: ${EA_RELEASE:-dev}
    image: ea-server
    logging: *logging-collected
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ../.env
    environment:
      # This overrides the dev URL of the env file. The server holds no admin key: only `migrate` has the migrator URL, and
      # deploy/check-server-env.sh checks the running container (deploy/README.md § Env split).
      DATABASE_URL: postgres://app:${APP_PASSWORD:?}@db:5432/email_assistant?sslmode=disable
      PORT: "8080"
      WEB_DIST: /app/apps/web/dist
      # The VPS log is JSON lines whatever .env says: a new install copies .env.example, which sets text (ADR 0024).
      LOG_FORMAT: json
      # The backup status file (deploy/backup.sh writes it on the host; README § Backups). The backup-age alert reads it.
      BACKUP_STATUS_FILE: /run/ea-backup/status.json
    volumes:
      - ./backup-status:/run/ea-backup:ro
    # Loopback only: Tailscale Serve on the host proxies to it (ADR 0017). Never publish on 0.0.0.0.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8080/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      retries: 3

  # One-off commands: `$C run --rm cli bun run <script> …`. It reuses the server image and the same .env.
  # Its output goes to your terminal and to the `local` log, never to the log store (ADR 0024 point 4).
  # No ports are published: `run` skips them unless you pass --service-ports.
  cli:
    extends:
      service: server
    profiles: [cli]
    logging: *logging-local
    restart: "no"
    healthcheck:
      disable: true
    environment:
      LOG_FORMAT: text

  # Runs the migrations: `$C run --rm -T migrate`. It alone holds the migrator URL. No env file, no port, no volume, no healthcheck. Its output goes to your terminal and to the `local` log.
  migrate:
    image: ea-server
    pull_policy: never
    profiles: [cli]
    logging: *logging-local
    restart: "no"
    environment:
      MIGRATOR_DATABASE_URL: postgres://migrator:${MIGRATOR_PASSWORD:?}@db:5432/email_assistant?sslmode=disable
      LOG_FORMAT: text
    command: ["bun", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  # Log store (ADR 0024 point 5), tailnet only. Start it with `--profile ops`; without the profile nothing changes.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    profiles: [ops]
    logging: *logging-local
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      # 30d: without a suffix the number is months.
      - -retentionPeriod=30d
      - -retention.maxDiskSpaceUsageBytes=1GiB
      - -httpListenAddr=:9428
    volumes:
      - vlogs-data:/vlogs
    mem_limit: 256m
    # Loopback only; Tailscale Serve proxies to it.
    ports:
      - "127.0.0.1:9428:9428"
    healthcheck:
      test: ["CMD", "/victoria-logs-prod", "-healthcheck", "-httpListenAddr=:9428"]
      interval: 30s
      retries: 3

  # Reads the json-file logs of the containers (only `server` writes them) and sends them to the store.
  # It runs as root: Docker writes those files with mode 0640.
  vlagent:
    image: victoriametrics/vlagent:v1.54.0
    profiles: [ops]
    logging: *logging-local
    restart: unless-stopped
    command:
      - -remoteWrite.url=http://victorialogs:9428/internal/insert
      - -tmpDataPath=/vlagent
      # Caps what vlagent buffers on disk when the store is down (vlagent-data).
      - -remoteWrite.maxDiskUsagePerURL=500MB
      # Only json-file logs: the server's (ADR 0024 point 4).
      - -fileCollector.glob=/var/lib/docker/containers/*/*-json.log
      - -fileCollector.ignoreFields=hostname
      - -httpListenAddr=:9429
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - vlagent-data:/vlagent
    mem_limit: 64m
    depends_on:
      victorialogs:
        condition: service_healthy

# The subnet is pinned, so the gateway never changes after a `down` or a Docker upgrade.
# WEB_TRUSTED_PROXIES in .env is this gateway (deploy/README.md "Web panel", ADR 0017).
# Keep it apart from the LAN (192.168.1.0/24), the Tailscale ranges and the other Docker networks of the host.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  db-data: {}
  vlogs-data: {}
  vlagent-data: {}
