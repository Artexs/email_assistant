name: email-assistant

# Docker log rotation for every service: 5 files of 10 MB per container (deploy/README.md § Logs). deploy/check-logging.sh checks it.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:17
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: email_assistant
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      APP_PASSWORD: ${APP_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../db/roles.sql:/db/roles.sql:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "email_assistant"]
      interval: 2s
      retries: 15

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ea-server
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ../.env
    environment:
      # These override the dev URLs of the env file
      DATABASE_URL: postgres://app:${APP_PASSWORD:?}@db:5432/email_assistant?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://migrator:${MIGRATOR_PASSWORD:?}@db:5432/email_assistant?sslmode=disable
      PORT: "8080"
      WEB_DIST: /app/apps/web/dist
      # The VPS log is JSON lines whatever .env says: a new install copies .env.example, which sets text (ADR 0024).
      LOG_FORMAT: json
    # Loopback only: Tailscale Serve on the host proxies to it (ADR 0017). Never publish on 0.0.0.0.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8080/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      retries: 3

# The subnet is pinned, so the gateway never changes after a `down` or a Docker upgrade.
# WEB_TRUSTED_PROXIES in .env is this gateway (deploy/README.md "Web panel", ADR 0017).
# Keep it apart from the LAN (192.168.1.0/24), the Tailscale ranges and the other Docker networks of the host.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  db-data: {}
