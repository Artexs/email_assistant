name: email-assistant

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: email_assistant
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      APP_PASSWORD: ${APP_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../db/roles.sql:/db/roles.sql:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "email_assistant"]
      interval: 2s
      retries: 15

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ea-server
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ../.env
    environment:
      # These override the dev URLs of the env file
      DATABASE_URL: postgres://app:${APP_PASSWORD:?}@db:5432/email_assistant?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://migrator:${MIGRATOR_PASSWORD:?}@db:5432/email_assistant?sslmode=disable
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8080/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 30s
      retries: 3

volumes:
  db-data: {}
