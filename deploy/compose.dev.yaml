# Dev overrides: publishes the db port and runs a local IMAP/SMTP test server.
# Use with: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  greenmail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false"
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
      - "127.0.0.1:3993:3993"
