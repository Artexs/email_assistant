# Dev overrides: publishes the db port and runs a local IMAP/SMTP test server.
# Use with: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  # No backup runs in dev: an empty value turns the backup-age check off (deploy/compose.yaml sets the status file).
  server:
    environment:
      BACKUP_STATUS_FILE: ""

  greenmail:
    image: greenmail/standalone:2.1.15
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false"
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
      - "127.0.0.1:3993:3993"
