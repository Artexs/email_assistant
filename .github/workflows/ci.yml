name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://app:app_ci@localhost:5432/email_assistant?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/email_assistant?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - name: Create database roles
        run: >-
          psql "postgresql://postgres:postgres@localhost:5432/email_assistant"
          -v ON_ERROR_STOP=1 -v migrator_password=migrator_ci -v app_password=app_ci
          -f db/roles.sql
      - run: bun run db:migrate
      - run: bun run test:int
      - run: bun run web:build
