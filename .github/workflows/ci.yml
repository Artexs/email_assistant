name: CI

on:
  push:
    branches: [master, "task/**"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}
  # The docs deploy (docs-deploy.yml) runs every job of this file before it makes the shots: a published site passed all checks of CI.
  workflow_call: {}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      greenmail:
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false"
        ports: ["3025:3025", "3143:3143", "3993:3993"]
    env:
      TEST_IMAP_HOST: 127.0.0.1
      TEST_IMAP_PORT: "3143"
      TEST_IMAPS_PORT: "3993"
      TEST_SMTP_PORT: "3025"
      DATABASE_URL: postgres://app:app_ci@localhost:5432/email_assistant?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/email_assistant?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Astro 7 CLI needs Node 22.23.4 or later (ticket F101-panel-to-astro-7): pinned, not the runner image's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint:full
      - run: bun run typecheck
      # A migration after the cutoff with a contract statement needs a `-- contract: v<x.y.z>` line (docs/code-patterns.md § Migrations).
      - run: bun run db:check-migrations
      - name: Generate a test credentials key
        run: echo "CREDENTIALS_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: bun run test:unit
      - name: Create database roles
        run: >-
          psql "postgresql://postgres:postgres@localhost:5432/email_assistant"
          -v ON_ERROR_STOP=1 -v migrator_password=migrator_ci -v app_password=app_ci
          -f db/roles.sql
      - run: bun run db:migrate
      - run: bun run test:int
      - run: bun run web:build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      greenmail:
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false"
        ports: ["3025:3025", "3143:3143", "3993:3993"]
    env:
      TEST_IMAP_HOST: 127.0.0.1
      TEST_IMAP_PORT: "3143"
      TEST_IMAPS_PORT: "3993"
      TEST_SMTP_PORT: "3025"
      E2E_DATABASE_URL: postgres://app:app_ci@localhost:5432/email_assistant_e2e?sslmode=disable
      E2E_MIGRATOR_DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/email_assistant_e2e?sslmode=disable
      DATABASE_URL: postgres://app:app_ci@localhost:5432/email_assistant_e2e?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/email_assistant_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Playwright runner is Node (D19): pinned, not the runner image's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Generate a test credentials key
        run: echo "CREDENTIALS_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Create database roles and the e2e database
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/email_assistant" -v ON_ERROR_STOP=1 -v migrator_password=migrator_ci -v app_password=app_ci -f db/roles.sql
          psql "postgresql://postgres:postgres@localhost:5432/email_assistant" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE email_assistant_e2e'
          psql "postgresql://postgres:postgres@localhost:5432/email_assistant_e2e" -v ON_ERROR_STOP=1 -c 'GRANT CONNECT ON DATABASE email_assistant_e2e TO migrator, app' -c 'REVOKE CREATE ON SCHEMA public FROM PUBLIC' -c 'GRANT USAGE, CREATE ON SCHEMA public TO migrator' -c 'GRANT USAGE ON SCHEMA public TO app'
      - run: bun run db:migrate
      # The seed cases skip in the ci job (no e2e URLs there, so test:int skips them); here they must run, and a skip fails the step.
      - name: Run the e2e seed cases and fail on a skip
        run: |
          log=$(mktemp)
          bun test apps/server/test/integration/e2e-seed.test.ts 2>&1 | tee "$log"
          if grep -Eq '^ *[0-9]+ skip' "$log"; then echo "e2e seed cases were skipped"; exit 1; fi
      - run: bun run web:build:dev
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/e2e/test-results/
          retention-days: 7
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check that the image uses the pinned Bun
        run: test "FROM oven/bun:$(tr -d '[:space:]' < .bun-version)" = "$(head -n 1 deploy/Dockerfile)"
      - name: Check that every Compose service rotates its log (the sim file is checked on its own)
        run: bash deploy/check-logging.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # deploy/sim.env is not in git. The CI runner is throwaway: it gets a copy of the example so that Compose finds the env_file of the services (older Compose versions check that the file exists even with --no-env-resolution).
      # The file in the Compose file stays required: on the VPS a missing deploy/sim.env stops `sim:up` with an error, and the services never start with another env.
      - name: Check that the sim Compose file is valid and keeps the sim stack apart from production
        run: |
          cp deploy/sim.env.example deploy/sim.env
          docker compose -p ea-sim -f deploy/compose.sim.yaml --env-file deploy/sim.env config --quiet --no-env-resolution
          bun run sim:check
      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t ea-server:ci .
      - name: Build the sim image on a sim-only tag and check its guard and its state folder
        run: |
          docker tag ea-server:ci ea-sim-base:ci
          docker build -f deploy/Dockerfile.sim --build-arg EA_SERVER_IMAGE=ea-sim-base:ci -t ea-sim-server:ci .
          test "$(docker run --rm --entrypoint stat ea-sim-server:ci -c %U /var/lib/ea-lab)" = "bun"
          docker run --rm --env-file deploy/sim.env.example ea-sim-server:ci bun run lab:env-check
          # The guard must refuse with the code of the real-form token on stdout and a non-zero exit (a missing script or corpus would fail too, but with another output).
          status=0
          out="$(docker run --rm --env-file deploy/sim.env.example -e TELEGRAM_BOT_TOKEN=7234567890:AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsaw ea-sim-server:ci bun run lab:env-check)" || status=$?
          echo "$out"
          test "$status" -ne 0
          test "$out" = "[lab-env-check] telegram_token_not_fake"
      - name: Check that the image holds only the package.json of the test tools
        run: |
          files="$(docker run --rm --entrypoint find ea-server:ci /app/tools -not -path '*/node_modules/*' -not -name node_modules -type f | sort)"
          echo "$files"
          test "$files" = "/app/tools/fake-telegram/package.json"
      - name: Check that the image holds only the package.json of the docs app
        run: |
          files="$(docker run --rm --entrypoint find ea-server:ci /app/apps/docs -not -path '*/node_modules/*' -not -name node_modules -type f | sort)"
          echo "$files"
          test "$files" = "/app/apps/docs/package.json"
      - name: Check that the image holds no Starlight tree
        run: |
          docker run --rm --entrypoint test ea-server:ci ! -e /app/node_modules/@astrojs/starlight
          docker run --rm --entrypoint test ea-server:ci ! -e /app/node_modules/pagefind
      - name: Check that the image holds the built web app
        run: docker run --rm --entrypoint test ea-server:ci -f /app/apps/web/dist/login/index.html
  # The docs site (ADR 0030): every push and pull request builds it with all its checks. No services.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Astro 7 CLI needs Node 22.23.4 or later: pinned, not the runner image's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - run: bun run docs:stale
      # The browser check of the built site (stage 06): CSP, search, language, accessibility, the 404 page. Chromium only.
      - run: bunx playwright install --with-deps chromium
      - run: bun run docs:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-playwright-results
          path: apps/docs/e2e/test-results/
          retention-days: 7
