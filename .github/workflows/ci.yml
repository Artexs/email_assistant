name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      greenmail:
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false"
        ports: ["3025:3025", "3143:3143", "3993:3993"]
    env:
      TEST_IMAP_HOST: 127.0.0.1
      TEST_IMAP_PORT: "3143"
      TEST_IMAPS_PORT: "3993"
      TEST_SMTP_PORT: "3025"
      DATABASE_URL: postgres://app:app_ci@localhost:5432/email_assistant?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/email_assistant?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Generate a test credentials key
        run: echo "CREDENTIALS_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: bun run test:unit
      - name: Create database roles
        run: >-
          psql "postgresql://postgres:postgres@localhost:5432/email_assistant"
          -v ON_ERROR_STOP=1 -v migrator_password=migrator_ci -v app_password=app_ci
          -f db/roles.sql
      - run: bun run db:migrate
      - run: bun run test:int
      - run: bun run web:build
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t ea-server:ci .
      - name: Check that the image holds only the package.json of the test tools
        run: |
          files="$(docker run --rm --entrypoint find ea-server:ci /app/tools -not -path '*/node_modules/*' -not -name node_modules -type f | sort)"
          echo "$files"
          test "$files" = "/app/tools/fake-telegram/package.json"
