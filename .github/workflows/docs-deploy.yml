name: Docs deploy

# Publishes the docs site to GitHub Pages (ADR 0030 point 2).
# - A pushed tag `v<x.y.z>` deploys only when it is the newest release tag (apps/docs/scripts/deploy-gate.ts).
# - A manual run deploys the ref chosen in the GitHub UI, also an old tag (rollback).
# The first deploy is an owner step: this workflow does not run until the owner starts it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Least privilege: the workflow reads the repository. Only the `deploy` job gets the Pages permissions.
permissions:
  contents: read

# GitHub drops an older pending run when a newer one waits: accepted, the newer run is the one to keep.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      # Same major of the three setup actions as ci.yml. Full history: the gate needs every tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The Astro 7 CLI needs Node 22.23.4 or later: pinned, not the runner image's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The github context goes in as env, never into the script text.
      - name: Decide whether this run deploys
        id: gate
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_REF_TYPE: ${{ github.ref_type }}
          GATE_REF_NAME: ${{ github.ref_name }}
        run: git tag --list 'v*' | bun apps/docs/scripts/deploy-gate.ts
      # A stale public Polish page blocks a release (ADR 0030 point 5).
      - name: Check that no public Polish page is stale
        if: steps.gate.outputs.deploy == 'true'
        run: bun run docs:stale --strict
      # In-place pages link to GitHub at this ref: the tag of a tag push, the commit of a manual run.
      - name: Build the site
        if: steps.gate.outputs.deploy == 'true'
        env:
          DOCS_GIT_REF: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
        run: bun run docs:build
      - name: Upload the site
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
